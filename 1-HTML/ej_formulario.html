<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio Formulario</title>
    <style>
        form {
            display: block;
            margin-top: 0em;
        }
    </style>
</head>
<body>
<!--Cree un Formulario con los campos que se proponen a continuacion-->
<!--Agregue el atributo legend-->

<!--Si tienes dudas de como hacer un formulario, puedes consultar:
    https://www.w3schools.com/html/tryit.asp?filename=tryhtml_elem_output-->

<h3>Suscribase a Nuestro Portal de Noticias! Crear una cuenta es rápido!</h3>
<form name="form-suscription">
    <p>
<label for="nombre">Nombre:</label>
<input type="text" name="nombre" placeholder="Ingrese su nombre">
</p>
<p>
<label for="apellido">Apellido:</label>
<input type="text" id="apellido" name="apellido" placeholder="Ingrese su apellido">
</p>
<p>
Sexo: 
<label for="masculino">Masculino</label>
<input type="radio" id="masculino" name="sex" value="Masculino">
<label for="femenino">Femenino</label>
<input type="radio" id="femenino" name="sex" value="Femenino">
</p>
<p>
<label for="edad">Edad:</label>
<input type="number" id="edad" name="edad" placeholder="Ingrese su edad">
</p>
<p>
<label for="email"></label>Email:</label>
<input type="email" id="email" name="email" placeholder="usuario@dominio.com">
</p>
<p>
<label for="username">Nombre de Usuario:</label>
<input type="text" id="username" name="username" placeholder="Ingrese su nombre de usuario">
</p>
<p>
<label for="password">Password:</label>
<input type="password" id="password" name="password" placeholder="Ingrese su contraseña">
</p>
<p>
<label for="confirm_password">Confirmar Password:</label>
<input type="password" id="confirm_password" name="confirm_password" placeholder="Confirme su contraseña">
</p>
<p>
<label for="tipo_servicio">Tipo de servicio:</label>
<select id="tipo_servicio" name="tipo_servicio">
    <option value="Free">Free</option>
    <option value="Standard">Standard</option>
    <option value="Premium">Premium</option>
</select>
</p>
<p>
Tema:
<label for="politica">Política</label>
<input type="checkbox" id="politica" name="tema" value="Politica">
<label for="negocios">Negocios</label>
<input type="checkbox" id="negocios" name="tema" value="Negocios">
<label for="tecnologia">Tecnología</label>
<input type="checkbox" id="tecnologia" name="tema" value="Tecnologia">
<label for="salud">Salud</label>
<input type="checkbox" id="salud" name="tema" value="Salud">
</p>
<p>
<label for="comentario">Agregue un comentario:</label>
<textarea id="comentario" name="comentario">
    Deje su comentario...
</textarea>
</p>
<p>
Boton de Enviar
<button type="button">
    Boton de Enviar
</button>
</p>
</form>
</body>
</html>
