
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Timeline estilo Jira - Bootstrap</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f5f6fa;
        }

        .timeline-scroll {
            overflow-x: auto;
        }

        .timeline {
            min-width: 900px;
            background-color: white;
            border: 1px solid #ccc;
        }

        .months,
        .weeks {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
        }

        .months > div {
            grid-column: span 4;
        }

        .weeks > div {
            border: 1px solid #444;
            padding: 10px 0;
            font-size: 12px;
        }

        .timeline-body {
            position: relative;
            height: 390px;
            background-image: linear-gradient(
                to right,
                #e5e7eb 1px,
                transparent 1px
            );
            background-size: 12.5% 100%;
        }

        .task {
            position: absolute;
            width: 39%;
            min-height: 100px;
            padding: 12px;
            font-size: 13px;
        }

        .task-1 {
            top: 35px;
            left: 2%;
        }

        .task-2 {
            top: 145px;
            left: 27%;
        }

        .task-3 {
            top: 255px;
            left: 51%;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid white;
        }

        .avatar + .avatar {
            margin-left: -8px;
        }
    </style>

</head>

<body>

    <main class="container my-5">

        <h1 class="text-center mb-4">
            Timeline de proyectos
        </h1>

        <p class="text-center text-secondary">
            Seguimiento de tareas estilo Jira utilizando Bootstrap
        </p>

        <div class="timeline-scroll shadow-sm">

            <div class="timeline">

                <!-- Meses -->
                <div class="months bg-black text-white text-center fw-bold">

                    <div class="border border-secondary py-3">
                        Enero
                    </div>

                    <div class="border border-secondary py-3">
                        Febrero
                    </div>

                </div>

                <!-- Semanas -->
                <div class="weeks bg-black text-white text-center">

                    <div>Semana 1</div>
                    <div>Semana 2</div>
                    <div>Semana 3</div>
                    <div>Semana 4</div>

                    <div>Semana 1</div>
                    <div>Semana 2</div>
                    <div>Semana 3</div>
                    <div>Semana 4</div>

                </div>

                <!-- Tareas -->
                <div class="timeline-body">

                    <!-- Tarea 1 -->
                    <div class="task task-1 bg-secondary text-white rounded">

                        <span class="text-info fw-bold">
                            Completed
                        </span>

                        <div class="d-flex justify-content-between align-items-center gap-2 mt-2">

                            <div>
                                <h6 class="fw-bold mb-1">
                                    Define Architecture
                                </h6>

                                <small class="opacity-75">
                                    20 Enero
                                </small>
                            </div>

                            <div class="d-flex">
                                <img
                                    class="avatar"
                                    src="https://i.pravatar.cc/100?img=12"
                                    alt="Responsable 1"
                                >

                                <img
                                    class="avatar"
                                    src="https://i.pravatar.cc/100?img=47"
                                    alt="Responsable 2"
                                >
                            </div>

                        </div>

                    </div>

                    <!-- Tarea 2 -->
                    <div class="task task-2 bg-secondary text-white rounded">

                        <span class="text-warning fw-bold">
                            In Progress
                        </span>

                        <div class="d-flex justify-content-between align-items-center gap-2 mt-2">

                            <div>
                                <h6 class="fw-bold mb-1">
                                    Define Architecture
                                </h6>

                                <small class="opacity-75">
                                    10 Febrero
                                </small>
                            </div>

                            <div class="d-flex">
                                <img
                                    class="avatar"
                                    src="https://i.pravatar.cc/100?img=12"
                                    alt="Responsable 1"
                                >

                                <img
                                    class="avatar"
                                    src="https://i.pravatar.cc/100?img=32"
                                    alt="Responsable 3"
                                >
                            </div>

                        </div>

                    </div>

                    <!-- Tarea 3 -->
                    <div class="task task-3 bg-secondary text-white rounded">

                        <span class="text-danger fw-bold">
                            Blocked
                        </span>

                        <div class="d-flex justify-content-between align-items-center gap-2 mt-2">

                            <div>
                                <h6 class="fw-bold mb-1">
                                    Define Architecture
                                </h6>

                                <small class="opacity-75">
                                    25 Febrero
                                </small>
                            </div>

                            <div class="d-flex">
                                <img
                                    class="avatar"
                                    src="https://i.pravatar.cc/100?img=47"
                                    alt="Responsable 2"
                                >

                                <img
                                    class="avatar"
                                    src="https://i.pravatar.cc/100?img=32"
                                    alt="Responsable 3"
                                >
                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

</body>

</html>
