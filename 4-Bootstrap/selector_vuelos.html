
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selector de vuelos - Bootstrap</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f2f4f7;
        }

        .calendar-container {
            width: min(720px, 95vw);
            max-height: 80vh;
            overflow-y: auto;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 4px;
        }

        .calendar-day {
            border: 0;
            border-radius: 5px;
            background: transparent;
            padding: 9px 0;
            width: 100%;
            font-size: 13px;
        }

        .calendar-day:not(:disabled):hover {
            background-color: #dbeafe;
        }

        .calendar-day.selected {
            background-color: #0d6efd;
            color: white;
        }

        .calendar-day:disabled {
            color: #aaa;
        }

        .weekday {
            text-align: center;
            font-weight: bold;
            font-size: 12px;
            padding: 9px 0;
        }

        .month-title {
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <main class="container my-5">

        <h1 class="text-center mb-4">
            Selector de fechas de vuelos
        </h1>

        <div class="dropdown">

            <!-- Botón principal -->
            <button
                class="btn btn-primary dropdown-toggle"
                type="button"
                id="botonFechas"
                data-bs-toggle="dropdown"
                data-bs-auto-close="outside"
                aria-expanded="false"
            >
                Seleccioná la fecha
            </button>

            <!-- Calendario desplegable -->
            <div class="dropdown-menu p-4 shadow calendar-container">

                <h5 class="text-center mb-4">
                    Fechas de vuelos
                </h5>

                <!-- Navegación entre meses -->
                <div class="d-flex justify-content-between align-items-center mb-3">

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        id="mesAnterior"
                    >
                        &lt;
                    </button>

                    <span class="fw-bold">
                        Seleccioná un día
                    </span>

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        id="mesSiguiente"
                    >
                        &gt;
                    </button>

                </div>

                <!-- Dos meses -->
                <div class="row g-3">

                    <div class="col-12 col-md-6 border-end-md">

                        <h6 class="month-title" id="tituloMes1"></h6>

                        <div class="calendar-grid" id="calendario1"></div>

                    </div>

                    <div class="col-12 col-md-6">

                        <h6 class="month-title" id="tituloMes2"></h6>

                        <div class="calendar-grid" id="calendario2"></div>

                    </div>

                </div>

                <!-- Botones inferiores -->
                <div class="d-flex justify-content-between mt-4">

                    <button
                        type="button"
                        class="btn btn-outline-secondary"
                        id="cancelar"
                    >
                        Cancelar
                    </button>

                    <button
                        type="button"
                        class="btn btn-outline-primary"
                        id="guardar"
                    >
                        Guardar
                    </button>

                </div>

            </div>
        </div>

        <p class="mt-4" id="fechaElegida">
            Todavía no seleccionaste una fecha.
        </p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const meses = [
            "Enero", "Febrero", "Marzo", "Abril",
            "Mayo", "Junio", "Julio", "Agosto",
            "Septiembre", "Octubre", "Noviembre", "Diciembre"
        ];

        const diasSemana = [
            "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"
        ];

        const hoy = new Date();

        // Primer mes visible
        let mesActual = new Date(
            hoy.getFullYear(),
            hoy.getMonth(),
            1
        );

        let fechaSeleccionada = null;

        const tituloMes1 = document.getElementById("tituloMes1");
        const tituloMes2 = document.getElementById("tituloMes2");

        const calendario1 = document.getElementById("calendario1");
        const calendario2 = document.getElementById("calendario2");

        const botonFechas = document.getElementById("botonFechas");

        function mismaFecha(fecha1, fecha2) {
            return fecha1 &&
                fecha2 &&
                fecha1.getFullYear() === fecha2.getFullYear() &&
                fecha1.getMonth() === fecha2.getMonth() &&
                fecha1.getDate() === fecha2.getDate();
        }

        // Crear el calendario de un mes
        function generarCalendario(fechaMes, contenedor, titulo) {

            contenedor.innerHTML = "";

            const anio = fechaMes.getFullYear();
            const mes = fechaMes.getMonth();

            titulo.textContent = meses[mes] + " " + anio;

            // Encabezados de los días
            diasSemana.forEach(dia => {
                const elemento = document.createElement("div");

                elemento.className = "weekday";
                elemento.textContent = dia;

                contenedor.appendChild(elemento);
            });

            // Primer día del mes
            const primerDia = new Date(anio, mes, 1);

            // Convertimos domingo=0 a lunes=0
            const inicio = (primerDia.getDay() + 6) % 7;

            // Espacios antes del primer día
            for (let i = 0; i < inicio; i++) {
                const espacio = document.createElement("div");
                contenedor.appendChild(espacio);
            }

            const diasDelMes = new Date(
                anio,
                mes + 1,
                0
            ).getDate();

            // Crear cada día
            for (let dia = 1; dia <= diasDelMes; dia++) {

                const boton = document.createElement("button");

                boton.type = "button";
                boton.className = "calendar-day";
                boton.textContent = dia;

                const fecha = new Date(anio, mes, dia);

                if (fecha < new Date(
                    hoy.getFullYear(),
                    hoy.getMonth(),
                    hoy.getDate()
                )) {
                    boton.disabled = true;
                }

                if (mismaFecha(fecha, fechaSeleccionada)) {
                    boton.classList.add("selected");
                }

                boton.addEventListener("click", () => {
                    fechaSeleccionada = fecha;
                    mostrarCalendarios();
                });

                contenedor.appendChild(boton);
            }
        }

        // Mostrar los dos meses
        function mostrarCalendarios() {

            const mesSiguiente = new Date(
                mesActual.getFullYear(),
                mesActual.getMonth() + 1,
                1
            );

            generarCalendario(
                mesActual,
                calendario1,
                tituloMes1
            );

            generarCalendario(
                mesSiguiente,
                calendario2,
                tituloMes2
            );
        }

        // Ir al mes anterior
        document.getElementById("mesAnterior")
            .addEventListener("click", () => {

                mesActual.setMonth(mesActual.getMonth() - 1);
                mostrarCalendarios();

            });

        // Ir al mes siguiente
        document.getElementById("mesSiguiente")
            .addEventListener("click", () => {

                mesActual.setMonth(mesActual.getMonth() + 1);
                mostrarCalendarios();

            });

        // Cancelar selección
        document.getElementById("cancelar")
            .addEventListener("click", () => {

                fechaSeleccionada = null;
                mostrarCalendarios();

                bootstrap.Dropdown.getOrCreateInstance(
                    botonFechas
                ).hide();

            });

        // Guardar fecha seleccionada
        document.getElementById("guardar")
            .addEventListener("click", () => {

                if (!fechaSeleccionada) {
                    alert("Primero seleccioná una fecha.");
                    return;
                }

                const fechaTexto = fechaSeleccionada.toLocaleDateString(
                    "es-AR"
                );

                document.getElementById("fechaElegida").textContent =
                    "Fecha seleccionada: " + fechaTexto;

                botonFechas.textContent = fechaTexto;

                bootstrap.Dropdown.getOrCreateInstance(
                    botonFechas
                ).hide();

            });

        // Mostrar calendario inicialmente
        mostrarCalendarios();
    </script>

</body>
</html>
